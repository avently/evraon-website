site_name: Evraon
site_url: https://evraon.com/
extra_css: [assets/styles/extra.css]
extra_javascript: [assets/js/extra.js]
docs_dir: 'docs'
site_dir: 'generated'
hooks:
  - hooks/default_language_prefix.py

theme:
  name: material
  favicon: assets/images/favicon.png
  logo: assets/images/logo.svg
  custom_dir: 'overrides'
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - navigation.expand
    #- navigation.tracking
    #- navigation.tabs.sticky
    #- navigation.sections

extra:
  alternate:
    - name: English
      link: /en/docs/
      lang: en

    - name: Русский
      link: /ru/docs/
      lang: ru

  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/evraon

    - icon: fontawesome/brands/github
      link: https://github.com/avently

markdown_extensions:
    - toc:
        permalink: ⚓
    - pymdownx.tabbed
    - pymdownx.superfences
    - meta
    #- admonition
nav:
  - Home: index.md
  - Docs:
    - Start:
      - docs/index.md
      - docs/installation.md
      - docs/structure.md
    - Tasks:
      - Main settings: docs/tasks/main.md
      - docs/tasks/demo.md

    - Strategies:
      - Main settings: docs/strategies/main.md
      - docs/strategies/scalper.md
      - docs/strategies/flash.md
      - docs/strategies/highlow.md
    - Exchanges:
      - docs/connectors/binance.md
      - docs/connectors/bitmex.md
      - docs/connectors/quik.md

plugins:
  - search
  - i18n:
      languages:
        - locale: en
          name: ENG
          build: true
          default: true
          nav_translations:
            Connectors: Exchanges
        - locale: ru
          name: РУС
          build: true
          nav_translations:
            Home: Главная
            Start: Начало
            Main settings: Основные настройки
            Docs: Документация
            Exchanges: Биржи
            Strategies: Стратегии
            Tasks: Задачи

